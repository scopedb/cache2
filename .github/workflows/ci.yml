name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  quality:
    if: github.event.pull_request.draft == false
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Select Rust 1.98
        run: rustup default 1.98.0
      - name: Install Hawkeye
        uses: taiki-e/install-action@v2
        with:
          tool: hawkeye@7.0.0
      - name: Check license headers
        run: hawkeye check
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check fuzz-target formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc --no-deps --locked
      - name: Verify publishable package
        run: cargo package --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, licenses, dependency policy, and sources
        run: cargo deny --all-features check advisories licenses bans sources

  test:
    if: github.event.pull_request.draft == false
    name: ${{ matrix.os }} / ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        features: [default, io-uring]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Select Rust 1.98
        run: rustup default 1.98.0
      - name: Check all targets
        if: matrix.features == 'default'
        run: cargo check --all-targets
      - name: Check all targets with optional io_uring
        if: matrix.features == 'io-uring'
        run: cargo check --all-targets --features io-uring
      - name: Run tests
        if: matrix.features == 'default'
        run: cargo test
      - name: Run extended recovery tests
        if: matrix.features == 'default'
        run: cargo test --lib -- --ignored
      - name: Run tests with optional io_uring
        if: matrix.features == 'io-uring'
        run: cargo test --features io-uring
      - name: Run optimized tests with all features
        if: matrix.features == 'io-uring'
        run: cargo test --release --all-features

  safety-checks:
    if: github.event.pull_request.draft == false
    name: persistent fuzz, ASan, and TSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust nightly
        run: rustup toolchain install nightly-2026-06-26 --profile minimal --component rust-src
      - name: Select pinned Rust nightly
        run: rustup default nightly-2026-06-26
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz persistent decoders and index probing
        run: cargo fuzz run persistent_decoders -- -runs=10000 -max_len=16384
      - name: Check library with AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --lib -- --test-threads=1
      - name: Check concurrency with ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread
        run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --release --lib -- --test-threads=1
