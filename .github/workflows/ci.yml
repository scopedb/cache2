name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Select Rust 1.98
        run: rustup default 1.98.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check fuzz-target formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: ${{ matrix.os }} / ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features: [default, no-default-features]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Select Rust 1.98
        run: rustup default 1.98.0
      - name: Check all targets
        if: matrix.features == 'default'
        run: cargo check --all-targets
      - name: Check all targets without default features
        if: matrix.features == 'no-default-features'
        run: cargo check --all-targets --no-default-features
      - name: Run tests
        if: matrix.features == 'default'
        run: cargo test
      - name: Run tests without default features
        if: matrix.features == 'no-default-features'
        run: cargo test --no-default-features

  safety-checks:
    name: persistent fuzz and mmap ASan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal
      - name: Select Rust nightly
        run: rustup default nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz persistent decoders and index probing
        run: cargo fuzz run persistent_decoders -- -runs=10000 -max_len=16384
      - name: Check mmap index with AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: "cargo test --lib index_storage::tests:: -- --test-threads=1"
