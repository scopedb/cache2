name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly toolchain
        run: >-
          rustup toolchain install nightly
          --profile minimal
          --component rustfmt,clippy
          --allow-downgrade
          --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          # rust-cache cannot reliably prune cargo package verification artifacts.
          cache-targets: false
      - name: Install lint tools
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: hawkeye,cargo-deny,taplo-cli,typos-cli
      - name: Run linters
        run: cargo x lint
      - name: Check workspace and feature matrix
        run: cargo x check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        rust-version: ["1.98.0", stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust ${{ matrix.rust-version }}
        run: >-
          rustup toolchain install ${{ matrix.rust-version }}
          --profile minimal
          --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run workspace and extended tests
        run: cargo x test
      - name: Run optimized tests with all features
        run: cargo test --workspace --release --all-features

  safety:
    name: Safety
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-06-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust nightly
        run: >-
          rustup toolchain install nightly-2026-06-26
          --profile minimal
          --component rust-src
          --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check library with AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --package cache2 --lib -- --test-threads=1
      - name: Check concurrency with ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread
        run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --release --package cache2 --lib -- --test-threads=1

  required:
    name: Required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [check, test, safety]
    steps:
      - name: Guardian
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS"
          jq --exit-status 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
