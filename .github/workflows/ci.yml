name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.98.0

jobs:
  quality:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Install lint tools
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: hawkeye@7.0.0,cargo-deny@0.20.2
      - name: Run repository quality checks
        run: cargo x lint

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Check workspace and feature matrix
        run: cargo x check
      - name: Run workspace and extended tests
        run: cargo x test
      - name: Run optimized tests with all features
        run: cargo test --workspace --release --all-features

  safety-checks:
    name: ASan and TSan
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-06-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust nightly
        run: rustup toolchain install nightly-2026-06-26 --profile minimal --component rust-src
      - name: Check library with AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --package cache2 --lib -- --test-threads=1
      - name: Check concurrency with ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread
        run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --release --package cache2 --lib -- --test-threads=1
