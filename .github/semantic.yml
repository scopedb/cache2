# Pull request titles must follow:
#
#     <type>: <description>
#
# Scopes are intentionally not allowed. For example:
#
#     perf: accelerate CRC32C with crc-fast
#
# Configuration reference: https://github.com/Ezard/semantic-prs#configuration

enabled: true

titleOnly: true

scopes: []

types:
  - feat
  - fix
  - docs
  - style
  - refactor
  - perf
  - test
  - build
  - ci
  - chore
  - revert

targetUrl: https://github.com/scopedb/cache2/blob/main/.github/semantic.yml
