[package]
name = "benchmarks"
publish = false

edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
io-uring = ["cache2/io-uring"]

[dependencies]
cache2 = { workspace = true, features = ["benchmarking"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
asyncband = { workspace = true }
log = { workspace = true }
logforth = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[bench]]
harness = false
name = "cache"
path = "cache/main.rs"

[[bench]]
harness = false
name = "cache_soak"
path = "cache_soak/main.rs"

[[bench]]
harness = false
name = "mixed_workloads"
path = "mixed_workloads/main.rs"

[[bench]]
harness = false
name = "recovery_scale"
path = "recovery_scale/main.rs"

[[bench]]
harness = false
name = "region_index_turnover"
path = "region_index_turnover/main.rs"

[lints]
workspace = true
